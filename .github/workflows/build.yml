name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA + version
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jasonfen/sidechat-oss:latest
            ghcr.io/jasonfen/sidechat-oss:sha-${{ env.SHORT_SHA }}
            ghcr.io/jasonfen/sidechat-oss:v${{ env.VERSION }}
          build-args: |
            BUILD_SHA=${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mcp-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Read version
        run: echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Install MCP deps
        run: bun install --cwd mcp

      - name: Compile binaries for all targets
        run: |
          mkdir -p dist/mcp
          for t in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            name="sidechat-mcp-${t#bun-}"
            bun build --compile --target=$t mcp/src/server.ts --outfile "dist/mcp/$name"
          done
          (cd dist/mcp && sha256sum sidechat-mcp-* > SHA256SUMS)
          ls -lh dist/mcp

      - uses: actions/upload-artifact@v4
        with:
          name: mcp-binaries-v${{ env.VERSION }}
          path: dist/mcp/
          retention-days: 90

      - name: Create release on first push of this version (idempotent — skipped if release already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — skipping upload. Bump package.json version to cut a new release."
            exit 0
          fi
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes "MCP client binaries for v${VERSION}. Install via mcp/install-mcp.sh." \
            dist/mcp/sidechat-mcp-* dist/mcp/SHA256SUMS
